apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "getCaddyConfigName" . }}
  namespace: '{{ .Release.Namespace }}'
data:
  Caddyfile: |
{{- if eq (default "php-fpm" .Values.store.caddy.runtime) "frankenphp" }}
    {
      skip_install_trust
      admin 0.0.0.0:2019
      frankenphp {
        max_wait_time 3s
      }
      servers {
        trusted_proxies static private_ranges
      }
    }

    :8000 {
      root * /var/www/html/public
      encode zstd gzip

{{- if hasKey .Values.store "sidecarLogging" }}
      log {
        output stdout
        format json

        output file {{ include "caddyLogPath" . }} {
          roll_size 10MB
          roll_keep 5
          roll_keep_for 24h
        }
      }
{{- else }}
      log
{{- end }}

      @static {
        path /theme/* /media/* /thumbnail/* /bundles/* /sitemap/* /favicon.ico /robots.txt
      }
      handle @static {
        file_server
      }

      handle {
        rewrite * /index.php
        php
      }
    }
{{- else }}
    {
      servers {
        timeouts {
          # keep idle connections open long enough so Envoy doesn't try to reuse a connection Caddy already closed
          idle 30m
        }
      }
    }
    :8000 {
{{- if hasKey .Values.store "sidecarLogging" }}
    log {
      output stdout
      format json

      output file {{ include "caddyLogPath" . }} {
        roll_size 10MB
        roll_keep 5
        roll_keep_for 24h
      }
    }
{{ else }}
    log
{{- end }}
    route {
      tracing {
        span caddy
      }
      header {
       X-Trace-Id {http.vars.trace_id}
      }
      request_header X-Trace-Id {http.vars.trace_id}
      @default {
        not path /theme/* /media/* /thumbnail/* /bundles/*
      }
      root * /var/www/html/public
      php_fastcgi @default unix//tmp/php-fpm.sock {
        trusted_proxies private_ranges
        read_timeout {{ .Values.store.caddy.readTimeout }}
        write_timeout {{ .Values.store.caddy.writeTimeout }}
      }
      encode gzip
      file_server
      }
    }

    :8001 {
      handle /-/fpm/status {
        # Prometheus encodes query strings in scrape paths. PHP-FPM requires
        # openmetrics format, so append query here instead.
        rewrite * /-/fpm/status?openmetrics
        reverse_proxy unix//tmp/php-fpm.sock {
          transport fastcgi {
            env SCRIPT_NAME /-/fpm/status
          }
        }
      }
      # php-fpm ping, answered by the fpm master (no app bootstrap, no DB). Used
      # by the operator storefront liveness/startup probes so DB slowness never
      # restarts pods.
      handle /-/fpm/ping {
        reverse_proxy unix//tmp/php-fpm.sock {
          transport fastcgi {
            env SCRIPT_NAME /-/fpm/ping
          }
        }
      }
    }
{{- end }}
