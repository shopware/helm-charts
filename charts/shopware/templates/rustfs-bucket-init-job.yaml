{{- if .Values.rustfs.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rustfs-bucket-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: rustfs-bucket-init
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-bucket-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-buckets
        image: {{ .Values.rustfs.bucketInit.image.repository }}:{{ .Values.rustfs.bucketInit.image.tag }}
        command: ["sh", "-c"]
        args:
        - |
          set -e
          aws configure set default.s3.addressing_style path

          echo "Waiting for RustFS to be ready..."
          until aws s3api list-buckets > /dev/null 2>&1; do
            echo "RustFS not ready yet, waiting..."
            sleep 5
          done

          for bucket in shopware-private shopware-public; do
            if aws s3api head-bucket --bucket "$bucket" > /dev/null 2>&1; then
              echo "Bucket $bucket already exists"
            else
              echo "Creating bucket $bucket..."
              aws s3api create-bucket --bucket "$bucket"
            fi
          done

          echo "Setting public read policy on shopware-public bucket..."
          aws s3api put-bucket-policy --bucket shopware-public --policy '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
                "Resource": ["arn:aws:s3:::shopware-public"]
              },
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::shopware-public/*"]
              }
            ]
          }'

          echo "Buckets created successfully!"
          aws s3api list-buckets
        env:
        - name: AWS_ENDPOINT_URL
          value: http://{{ .Release.Name }}-rustfs-svc.{{ .Release.Namespace }}.svc.cluster.local:9000
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-rustfs-secret
              key: RUSTFS_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-rustfs-secret
              key: RUSTFS_SECRET_KEY
{{- end }}
