{{ if eq (include "blackfireCredentialsRef" .) "true" }}
{{ if hasKey .Values.store "blackfire" }}
{{ if .Values.store.blackfire.enabled | default false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopware-blackfire
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: blackfire
spec:
  replicas: 1
  selector:
      matchLabels:
        app: blackfire
  template:
      metadata:
        labels:
          app: blackfire
      spec:
        containers:
        - name: blackfire
          image: {{ .Values.blackfire.image | default "blackfire/blackfire:2" | quote }}
          env:
          - name: BLACKFIRE_SERVER_ID
            valueFrom:
              secretKeyRef:
                {{- with .Values.blackfire.serverIDRef }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          - name: BLACKFIRE_SERVER_TOKEN
            valueFrom:
              secretKeyRef:
                {{- with .Values.blackfire.serverTokenRef }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          ports:
          - containerPort: {{ .Values.blackfire.port | default 8307 }}
          resources:
            {{- with .Values.blackfire.resources }}
                {{- toYaml . | nindent 12 }}
            {{- end }}
---
# Service for blackfire
apiVersion: v1
kind: Service
metadata:
  name: {{ template "getBlackfireServiceName" . }}
  namespace: '{{ .Release.Namespace }}'
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  selector:
    app: blackfire
  ports:
    - protocol: TCP
      port: {{ .Values.blackfire.port | default 8307 }}
      targetPort: {{ .Values.blackfire.port | default 8307 }}
      appProtocol: tcp
{{ end }}
{{ end }}
{{ end }}
