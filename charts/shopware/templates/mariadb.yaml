{{ if hasKey .Values "mariadb" }}
{{ if .Values.mariadb.enabled | default false }}
{{- if .Values.percona.enabled }}
{{- fail "enable only one of .Values.percona.enabled / .Values.mariadb.enabled" }}
{{- end }}
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: {{ .Release.Name | quote }}
  namespace: '{{ .Release.Namespace }}'
  {{- with .Values.mariadb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
  port: {{ .Values.store.database.port | default 3306 }}
  database: {{ .Values.store.database.name | default "shopware" | quote }}

  # Without rootPasswordSecretKeyRef the operator defaults it to "<release>-root" /
  # key "password" with generate:true. getMariaDBSecretName and
  # getMariaDBSecretKey in _helpers.tpl mirror both cases.
  {{- with .Values.mariadb.rootPasswordSecretKeyRef }}
  rootPasswordSecretKeyRef:
    name: {{ .name | quote }}
    key: {{ .key | default "password" | quote }}
    generate: false
  {{- end }}

  storage:
    size: {{ .Values.mariadb.persistence.size | default "8Gi" | quote }}
    {{- with .Values.mariadb.persistence.storageClassName }}
    storageClassName: {{ . }}
    {{- end }}
    {{- with .Values.mariadb.persistence.pvcRetentionPolicy }}
    pvcRetentionPolicy:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  {{- with .Values.mariadb.podMetadata }}
  podMetadata:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.mariadb.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.mariadb.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.mariadb.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  # https://developer.shopware.com/docs/guides/hosting/performance/performance-tweaks.html
  {{- with .Values.mariadb.config }}
  myCnf: |
    {{- . | nindent 4 }}
  {{- end }}
{{ end }}
{{ end }}
