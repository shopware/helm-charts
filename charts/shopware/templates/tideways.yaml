{{ if eq (include "tidewaysCredentialsRef" .) "true" }}
{{ if hasKey .Values.store "tideways" }}
{{ if .Values.store.tideways.enabled | default false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopware-tideways
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: tideways
spec:
  replicas: 1
  selector:
      matchLabels:
        app: tideways
  template:
      metadata:
        labels:
          app: tideways
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: tideways
          image: {{ .Values.tideways.image | default "ghcr.io/tideways/daemon:1.19.0" | quote }}
          args:
          - --address=0.0.0.0:{{ .Values.tideways.port | default 9135 }}
          {{- with .Values.tideways.environment }}
          - --env={{ . }}
          {{- end }}
          ports:
          - containerPort: {{ .Values.tideways.port | default 9135 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          resources:
            {{- toYaml (.Values.tideways.resources | default (dict "requests" (dict "cpu" "10m" "memory" "64Mi") "limits" (dict "memory" "256Mi"))) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ template "getTidewaysServiceName" . }}
  namespace: '{{ .Release.Namespace }}'
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  selector:
    app: tideways
  ports:
    - protocol: TCP
      port: {{ .Values.tideways.port | default 9135 }}
      targetPort: {{ .Values.tideways.port | default 9135 }}
      appProtocol: tcp
{{ end }}
{{ end }}
{{ end }}
