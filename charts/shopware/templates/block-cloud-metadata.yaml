{{- if .Values.blockCloudMetadata.enabled }}
# Denies the store's pods access to the cloud metadata service, which hands out
# node credentials on AWS, GCP and Azure. All other egress stays allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-block-cloud-metadata" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      shop.shopware.com/store.name: {{ .Release.Name | quote }}
  policyTypes:
    - Egress
  egress:
    # Keep in-cluster pod traffic explicit: some CNIs (e.g. Cilium) don't match
    # pod IPs with ipBlock.
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
        - ipBlock:
            cidr: ::/0
            except:
              - fd00:ec2::254/128
{{- end }}
